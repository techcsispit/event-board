<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Event Board</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app-container">
    <header class="header">
      <div class="header-content">
        <h1 id="main-title">Campus Event Board</h1>
        <p>Discover workshops, hackathons, and student club fests on campus</p>
      </div>
      <button id="toggle-form-btn" class="btn btn-primary">+ Add New Event</button>
    </header>

    <section id="form-container" class="form-container hidden">
      <div class="card form-card">
        <h2 id="form-title">Submit an Event</h2>
        <form id="event-form">
          <input type="hidden" id="event-id">
          <div class="form-group">
            <label for="event-title">Event Title *</label>
            <input type="text" id="event-title" placeholder="e.g. AI & Robotics Seminar" required>
          </div>
          <div class="form-row">
            <div class="form-group">
              <label for="event-date">Date (YYYY-MM-DD) *</label>
              <input type="date" id="event-date" required>
            </div>
            <div class="form-group">
              <label for="event-location">Location *</label>
              <input type="text" id="event-location" placeholder="e.g. Auditorium / Lab 2" required>
            </div>
          </div>
          <div class="form-group">
            <label for="event-tags">Tags (comma separated)</label>
            <input type="text" id="event-tags" placeholder="e.g. Tech, Workshop, Design">
          </div>
          <div class="form-group">
            <label for="event-desc">Description</label>
            <textarea id="event-desc" rows="3" placeholder="Brief outline of the event..."></textarea>
          </div>
          <div class="form-actions">
            <button type="button" id="cancel-form-btn" class="btn btn-secondary">Cancel</button>
            <button type="submit" id="submit-form-btn" class="btn btn-primary">Create Event</button>
          </div>
        </form>
      </div>
    </section>

    <div class="controls-bar">
      <div class="search-box">
        <label for="tag-filter">Search Events:</label>
        <input type="text" id="tag-filter" placeholder="Search by title, tag, or location...">
        <button id="clear-filter-btn" class="btn btn-outline">Clear</button>
      </div>
      <div class="admin-auth">
        <label for="admin-token">Admin Token:</label>
        <input type="password" id="admin-token" placeholder="Enter token">
        <button id="admin-login-btn" class="btn btn-outline" style="padding: 0.5rem 1rem;">Login</button>
      </div>
      <div class="event-count" id="event-count">Loading events...</div>
    </div>

    <main class="events-grid" id="events-grid">
      <!-- Event cards will be dynamically injected here -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
